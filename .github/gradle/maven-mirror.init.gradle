// CI uniquement (copié dans ~/.gradle/init.d par android-build) : Maven
// Central répond HTTP 429 (« Too Many Requests ») aux runners GitHub. Tous les
// dépôts mavenCentral() — projet, Flutter, extensions, builds inclus — passent
// par le miroir officiel de Google (même contenu, mêmes sommes de contrôle).
def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'

def redirect = { repositories ->
    repositories.withType(MavenArtifactRepository).configureEach { repo ->
        if (repo.url.toString().startsWith('https://repo.maven.apache.org/maven2')) {
            repo.url = mirror
        }
    }
}

beforeSettings { settings ->
    redirect(settings.buildscript.repositories)
    redirect(settings.pluginManagement.repositories)
    redirect(settings.dependencyResolutionManagement.repositories)
}

allprojects {
    redirect(buildscript.repositories)
    redirect(repositories)
}

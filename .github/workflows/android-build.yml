name: android-build

# Construit l'APK de pilote (configuration staging) et la publie comme
# artefact téléchargeable depuis l'onglet Actions. Sans keystore de
# publication dans l'environnement, l'APK est signée avec la clé de débogage :
# installable sur téléphone, refusée par Google Play.

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-build.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK de pilote (staging)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Construire l'APK (release, configuration staging)
        run: flutter build apk --release --dart-define-from-file=config/staging.json
      - name: Vérifier l'APK (identifiant, SDK, signature)
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$bt/aapt2" dump badging "$apk" | tee /tmp/badging.txt | grep -E "^package:|sdkVersion|targetSdkVersion|application-label:"
          grep -q "package: name='com.ticketsur.fasosoft'" /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt
          grep -q "sdkVersion:'24'" /tmp/badging.txt
          "$bt/apksigner" verify --print-certs "$apk" | grep -E "Signer #1 certificate DN|SHA-256"
      - name: Nommer l'APK et calculer son empreinte
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          name="TicketSur-staging-${version}-${GITHUB_SHA::7}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "/tmp/$name"
          (cd /tmp && sha256sum "$name" | tee "$name.sha256")
          ls -l "/tmp/$name"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.APK_NAME }}
          path: |
            /tmp/${{ env.APK_NAME }}
            /tmp/${{ env.APK_NAME }}.sha256
          retention-days: 30
          if-no-files-found: error

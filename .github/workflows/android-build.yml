name: android-build

# Construit l'APK de pilote (configuration staging) et la publie comme
# artefact téléchargeable depuis l'onglet Actions. Sur main, avec la clé
# stable, elle est aussi publiée en GitHub Release « pilote-<build> », sous
# des noms fixes : lien direct permanent vers la dernière APK,
#   https://github.com/<dépôt>/releases/latest/download/TicketSur-staging-arm64-v8a.apk
#
# Signature : toutes les APK sont signées avec UNE clé stable (secrets du
# dépôt TICKETSUR_KEYSTORE_BASE64, TICKETSUR_KEYSTORE_PASSWORD,
# TICKETSUR_KEY_PASSWORD ; alias « ticketsur »), pour que chaque nouvelle APK
# s'installe par-dessus la précédente. La variable de dépôt
# TICKETSUR_SIGNING_CERT_SHA256 fige l'empreinte attendue : un build signé
# autrement échoue. Sans ces secrets (PR venant d'un fork), repli sur la clé
# de débogage du runner, signalé par un avertissement.

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-build.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK de pilote (staging)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.verify.outputs.artifact }}
      version: ${{ steps.verify.outputs.version }}
      signed: ${{ steps.verify.outputs.signed }}
    defaults:
      run:
        shell: bash
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      # Cache Gradle dont la clé suit aussi pubspec.lock : une extension
      # Android ajoutée apporte ses propres dépendances de build. Sans cela,
      # l'ancien cache était réutilisé tel quel et chaque build retéléchargeait
      # ces dépendances, jusqu'au refus de Maven Central (HTTP 429).
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Miroir de Maven Central (Maven Central refuse les runners GitHub, HTTP 429)
        run: |
          mkdir -p ~/.gradle/init.d
          cp "$GITHUB_WORKSPACE/.github/gradle/maven-mirror.init.gradle" ~/.gradle/init.d/
      - name: Préparer la clé de signature stable
        env:
          KEYSTORE_BASE64: ${{ secrets.TICKETSUR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Clé de signature absente : APK signée avec une clé de débogage jetable (ne s'installera pas par-dessus une autre version)."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ticketsur.jks"
          echo "TICKETSUR_KEYSTORE_PATH=$RUNNER_TEMP/ticketsur.jks" >> "$GITHUB_ENV"
      - name: Construire les APK (release, configuration staging, une par processeur)
        env:
          TICKETSUR_KEYSTORE_PASSWORD: ${{ secrets.TICKETSUR_KEYSTORE_PASSWORD }}
          # L'alias n'est pas un secret (un secret « ticketsur » ferait masquer
          # le nom de l'application dans tous les journaux).
          TICKETSUR_KEY_ALIAS: ticketsur
          TICKETSUR_KEY_PASSWORD: ${{ secrets.TICKETSUR_KEY_PASSWORD }}
        # Numéro de build = numéro du run : toujours croissant, chaque APK est
        # une mise à jour de la précédente.
        run: flutter build apk --release --split-per-abi --build-number="$GITHUB_RUN_NUMBER" --dart-define-from-file=config/staging.json
      - name: Effacer la clé du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/ticketsur.jks"
      - name: Vérifier les APK (identifiant, SDK, signature) et les nommer
        id: verify
        env:
          EXPECTED_CERT: ${{ vars.TICKETSUR_SIGNING_CERT_SHA256 }}
        run: |
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)+$GITHUB_RUN_NUMBER"
          mkdir -p /tmp/apk
          # arm64-v8a : la grande majorité des téléphones ; armeabi-v7a : appareils 32 bits anciens.
          for abi in arm64-v8a armeabi-v7a; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            echo "== $abi"
            "$bt/aapt2" dump badging "$apk" > /tmp/badging.txt
            grep -E "^package:|[sS]dkVersion:|application-label:|native-code:" /tmp/badging.txt
            grep -q "package: name='com.ticketsur.fasosoft'" /tmp/badging.txt
            grep -Eiq "^(min)?sdkVersion:'24'" /tmp/badging.txt
            grep -Eiq "^targetSdkVersion:'36'" /tmp/badging.txt
            # split-per-abi : versionCode = code ABI × 1000 + numéro de build.
            case "$abi" in armeabi-v7a) abi_code=1 ;; arm64-v8a) abi_code=2 ;; esac
            grep -q "versionCode='$((abi_code * 1000 + GITHUB_RUN_NUMBER))'" /tmp/badging.txt
            "$bt/apksigner" verify --print-certs "$apk" | tee /tmp/certs.txt | grep -E "certificate DN|certificate SHA-256"
            if [ -n "$EXPECTED_CERT" ]; then
              actual=$(grep -m1 "certificate SHA-256" /tmp/certs.txt | awk '{print $NF}')
              if [ "$actual" != "$EXPECTED_CERT" ]; then
                echo "::error::Signature inattendue ($actual) : l'APK ne s'installerait pas par-dessus les précédentes."
                exit 1
              fi
              echo "Signature stable vérifiée."
            fi
            name="TicketSur-staging-${version}-${GITHUB_SHA::7}-$abi.apk"
            cp "$apk" "/tmp/apk/$name"
          done
          (cd /tmp/apk && sha256sum *.apk | tee SHA256SUMS.txt && ls -lh)
          echo "ARTIFACT_NAME=TicketSur-staging-${version}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          {
            echo "artifact=TicketSur-staging-${version}-${GITHUB_SHA::7}"
            echo "version=$version"
            # Publication seulement si la signature stable a été vérifiée.
            if [ -n "$EXPECTED_CERT" ] && [ -n "${TICKETSUR_KEYSTORE_PATH:-}" ]; then
              echo "signed=true"
            else
              echo "signed=false"
            fi
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: /tmp/apk/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Version pilote (GitHub Releases)
    needs: apk
    # main seulement, et seulement une APK à la signature stable vérifiée.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.apk.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-pilote
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARTIFACT: ${{ needs.apk.outputs.artifact }}
      VERSION: ${{ needs.apk.outputs.version }}
      # Nombre de versions pilotes gardées (les plus anciennes sont retirées).
      KEEP: 15
    steps:
      - name: Récupérer les APK de ce build
        run: gh run download "$GITHUB_RUN_ID" -n "$ARTIFACT" -D build
      - name: Noms fixes (lien direct permanent)
        run: |
          mkdir release
          cp build/*-arm64-v8a.apk release/TicketSur-staging-arm64-v8a.apk
          cp build/*-armeabi-v7a.apk release/TicketSur-staging-armeabi-v7a.apk
          (cd release && sha256sum *.apk | tee SHA256SUMS.txt)
      - name: Publier la version pilote
        run: |
          tag="pilote-$GITHUB_RUN_NUMBER"
          base="https://github.com/$GH_REPO/releases/latest/download"
          {
            echo "APK de pilote **$VERSION** (configuration **staging**), commit \`${GITHUB_SHA::7}\`."
            echo
            echo "Installation : télécharger l'APK sur le téléphone, l'ouvrir, autoriser l'installation depuis cette source si Android le demande. Signée avec la clé stable : elle s'installe par-dessus la version précédente."
            echo
            echo "- Téléphones récents (presque tous) : \`TicketSur-staging-arm64-v8a.apk\`"
            echo "- Anciens appareils 32 bits : \`TicketSur-staging-armeabi-v7a.apk\`"
            echo
            echo "Liens permanents vers la dernière version :"
            echo "- $base/TicketSur-staging-arm64-v8a.apk"
            echo "- $base/TicketSur-staging-armeabi-v7a.apk"
            echo
            echo "Empreintes SHA-256 :"
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$tag" release/* \
            --target "$GITHUB_SHA" \
            --title "TicketSûr pilote $VERSION (staging)" \
            --notes-file notes.md \
            --latest
      - name: Retirer les versions pilotes anciennes
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("pilote-"))] | sort_by(.createdAt) | reverse | .['"$KEEP"':] | .[].tagName' |
          while read -r tag; do
            echo "Suppression de $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

name: push-diagnostic

# Diagnostic des notifications sur le staging, à la demande : compteurs de
# la file et des appareils (aucune donnée personnelle, aucun jeton), état de
# la fonction Edge, puis un appel de vidage de la file.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Diagnostic des notifications (staging)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    defaults:
      run:
        shell: bash
    env:
      SUPABASE_PROJECT_REF: mbngkfhselqyaopyfphn
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.2.0
      - name: Lier le projet
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Fonctions et secrets (noms seulement)
        run: |
          supabase functions list
          supabase secrets list | awk -F'|' 'NR<=2 || /FCM/ {print $1}'
      - name: File avant l'appel
        run: |
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$(cat supabase/.temp/pooler-url)" -X -q \
            -v ON_ERROR_STOP=1 -f supabase/tests/remote/push_diagnostic.sql
      - name: Appel de la fonction (sans clé, puis clé publiable)
        run: |
          url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/push-dispatch"
          key=$(jq -r .SUPABASE_PUBLISHABLE_KEY apps/mobile/config/staging.json)
          echo "Sans clé :"; curl -sS -o /tmp/r1 -w 'HTTP %{http_code}\n' -X POST "$url"; head -c 300 /tmp/r1; echo
          echo "Clé publiable :"; curl -sS -o /tmp/r2 -w 'HTTP %{http_code}\n' -X POST -H "apikey: $key" -H "authorization: Bearer $key" "$url"; head -c 300 /tmp/r2; echo
      - name: File après l'appel
        run: |
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$(cat supabase/.temp/pooler-url)" -X -q \
            -v ON_ERROR_STOP=1 -f supabase/tests/remote/push_diagnostic.sql

name: staging-tests

# Contrôles connectés sur le projet Supabase de staging : rapport de
# configuration (RLS, droits, Vault) puis tests d'acceptation joués dans une
# transaction annulée. Le mot de passe de la base reste dans l'environnement
# GitHub « staging » ; aucune donnée de test ne subsiste.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [deploy-staging]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - "supabase/tests/remote/**"
      - ".github/workflows/staging-tests.yml"

permissions:
  contents: read

concurrency:
  group: staging-tests
  cancel-in-progress: false

jobs:
  connected:
    name: Contrôles connectés (staging)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # Jamais pour une PR venant d'un fork (dépôt public).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      SUPABASE_PROJECT_REF: mbngkfhselqyaopyfphn
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Refuser les forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: exit 1
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.2.0
      - name: Lier le projet
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Client PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Contrôles connectés
        run: |
          url_file=supabase/.temp/pooler-url
          if [ ! -s "$url_file" ]; then
            echo "::error::URL du pooler introuvable après supabase link"; exit 1
          fi
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$(cat "$url_file")" -X -q \
            -v ON_ERROR_STOP=1 -f supabase/tests/remote/run_remote_checks.sql 2>&1 \
            | sed 's/^psql:.*NOTICE:  //' | grep -v '^$'

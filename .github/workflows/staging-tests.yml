name: staging-tests

# Contrôles connectés sur le projet Supabase de staging : rapport de
# configuration (RLS, droits, Vault) puis tests d'acceptation joués dans une
# transaction annulée. Le mot de passe de la base reste dans l'environnement
# GitHub « staging » ; aucune donnée de test ne subsiste.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [deploy-staging]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - "supabase/tests/remote/**"
      - ".github/workflows/staging-tests.yml"

permissions:
  contents: read

concurrency:
  group: staging-tests
  cancel-in-progress: false

jobs:
  connected:
    name: Contrôles connectés (staging)
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # Jamais pour une PR venant d'un fork (dépôt public).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    defaults:
      run:
        # « bash » explicite = -eo pipefail : un échec suivi d'un filtre (| grep)
        # fait échouer l'étape (le shell par défaut ne le faisait pas).
        shell: bash
    env:
      SUPABASE_PROJECT_REF: mbngkfhselqyaopyfphn
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Refuser les forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: exit 1
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.2.0
      - name: Lier le projet
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Client PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Rapport de configuration (RLS, droits, Vault)
        run: |
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$(cat supabase/.temp/pooler-url)" -X -q \
            -v ON_ERROR_STOP=1 -f supabase/tests/remote/run_remote_checks.sql 2>&1 \
            | sed 's/^psql:.*NOTICE:  //' | grep -v '^$'

      - name: Migrations du dépôt toutes déployées ?
        id: pending
        run: |
          supabase db push --remote --dry-run 2>&1 | tee /tmp/dry-run.txt
          if grep -q "Would push" /tmp/dry-run.txt; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Migrations non encore déployées : les tests d'acceptation connectés tourneront après le déploiement sur main."
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests d'acceptation connectés (transaction annulée)
        if: steps.pending.outputs.pending == 'false'
        run: |
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$(cat supabase/.temp/pooler-url)" -X -q \
            -v ON_ERROR_STOP=1 -f supabase/tests/remote/remote_acceptance.sql 2>&1 \
            | sed 's/^psql:.*NOTICE:  //' | grep -v '^$'

      # Les deux étapes suivantes visent les migrations DÉJÀ déployées : elles ne
      # tournent donc pas sur une PR (dont les migrations ne sont pas en ligne).
      - name: Bout en bout avec un vrai compte (API publique)
        if: github.event_name != 'pull_request' && steps.pending.outputs.pending == 'false'
        env:
          SUPABASE_URL: https://mbngkfhselqyaopyfphn.supabase.co
          # Clé publishable : publique par conception (déjà dans l'APK).
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_IwSIsneegvq1jJgXdClUHg_fDr8HLeU
        run: bash scripts/e2e-auth-api.sh

      - name: Nettoyage des comptes jetables
        if: always() && github.event_name != 'pull_request'
        run: |
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$(cat supabase/.temp/pooler-url)" -X -q \
            -v ON_ERROR_STOP=1 -f supabase/tests/remote/cleanup_e2e_accounts.sql

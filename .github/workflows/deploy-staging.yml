name: deploy-staging

# Applique les migrations versionnées au projet Supabase de staging.
# Prérequis (une seule fois, par le propriétaire du dépôt) : environnement
# GitHub « staging » avec les secrets SUPABASE_ACCESS_TOKEN et
# SUPABASE_DB_PASSWORD. Voir docs/operations/deploiement-supabase.md.
# Supabase CLI 3.x cible la base LOCALE par défaut : --remote est obligatoire.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  migrations:
    name: Migrations → Supabase staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      # Référence publique du projet (elle figure déjà dans l'URL de l'API).
      SUPABASE_PROJECT_REF: mbngkfhselqyaopyfphn
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Clé du compte de service Firebase (facultative : sans elle, la
      # fonction d'envoi est déployée mais n'envoie rien).
      TIKEO_FCM_SERVICE_ACCOUNT: ${{ secrets.TIKEO_FCM_SERVICE_ACCOUNT }}
      # Configuration Firebase de l'APK : la clé d'envoi doit venir du même
      # projet, sinon Firebase refuse tout (SENDER_ID_MISMATCH).
      TIKEO_GOOGLE_SERVICES_JSON: ${{ secrets.TIKEO_GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v7

      - name: Secrets présents
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name absent de l'environnement GitHub « staging »"
              missing=1
            fi
          done
          exit "$missing"

      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.2.0

      - name: Lier le projet
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Migrations à appliquer (simulation)
        run: supabase db push --remote --dry-run

      - name: Appliquer les migrations
        run: supabase db push --remote --yes

      - name: État des migrations
        run: supabase migration list --remote

      - name: Clé d'envoi des notifications (secret Supabase)
        run: |
          if [ -z "$TIKEO_FCM_SERVICE_ACCOUNT" ]; then
            echo "::warning::TIKEO_FCM_SERVICE_ACCOUNT absent de l'environnement « staging » : notifications non envoyées."
            exit 0
          fi
          if ! printf '%s' "$TIKEO_FCM_SERVICE_ACCOUNT" | jq -e '.client_email and .private_key and .project_id' > /dev/null; then
            echo "::error::TIKEO_FCM_SERVICE_ACCOUNT n'est pas une clé de compte de service Firebase (JSON)."
            exit 1
          fi
          if [ -n "$TIKEO_GOOGLE_SERVICES_JSON" ]; then
            # Identifiants de projet publics (présents dans l'APK).
            app=$(printf '%s' "$TIKEO_GOOGLE_SERVICES_JSON" | jq -r '.project_info.project_id // empty')
            sender=$(printf '%s' "$TIKEO_FCM_SERVICE_ACCOUNT" | jq -r '.project_id')
            if [ "$app" != "$sender" ]; then
              echo "::error::La clé TIKEO_FCM_SERVICE_ACCOUNT vient du projet Firebase « $sender », l'APK du projet « $app ». Générer la clé dans le projet « $app » (Paramètres du projet › Comptes de service)."
              exit 1
            fi
            echo "Clé d'envoi et APK : même projet Firebase ($app)."
          fi
          encoded=$(printf '%s' "$TIKEO_FCM_SERVICE_ACCOUNT" | jq -c . | base64 -w0)
          echo "::add-mask::$encoded"
          SUPABASE_YES=1 supabase secrets set "FCM_SERVICE_ACCOUNT_B64=$encoded" > /dev/null
          echo "Secret FCM_SERVICE_ACCOUNT_B64 posé."

      - name: Fonction d'envoi des notifications
        # Projet lié plus haut ; --use-api : empaquetage côté Supabase, sans Docker.
        env:
          SUPABASE_YES: "1"
        run: supabase functions deploy push-dispatch --use-api

      - name: Contrôle de l'API publique (visiteur anonyme)
        env:
          SUPABASE_URL: https://mbngkfhselqyaopyfphn.supabase.co
          # Clé publishable : publique par conception (déjà dans l'APK).
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_IwSIsneegvq1jJgXdClUHg_fDr8HLeU
        run: bash scripts/smoke-public-api.sh

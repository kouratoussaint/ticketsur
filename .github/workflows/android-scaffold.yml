name: android-scaffold

# Usage unique : génère le dossier android/ avec `flutter create` (bloqué dans
# la session de développement) et l'imprime dans le journal (tar.gz en base64)
# pour être relu, ajusté et committé par PR. Ce fichier est retiré ensuite.

on:
  push:
    branches: [chore/android-scaffold]

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.0
      - name: flutter create (plateforme Android uniquement)
        run: |
          flutter create --org com.ticketsur --project-name ticketsur \
            --platforms android --description "TicketSûr" . | tail -5
          git status --short
      - name: Dossier android/ (tar.gz base64)
        run: |
          tar czf /tmp/android.tgz android .metadata
          sha256sum /tmp/android.tgz
          echo "----- DEBUT ANDROID TGZ -----"
          base64 -w 0 /tmp/android.tgz
          echo
          echo "----- FIN ANDROID TGZ -----"

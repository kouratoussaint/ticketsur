name: db-tests

on:
  # Sans filtre de chemins sur les PR : ce check est obligatoire pour fusionner
  # dans main, il doit donc toujours rendre un résultat.
  pull_request:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/db-test.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Migrations, RLS, concurrence (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Client PostgreSQL
        # Le client est déjà présent sur les images ubuntu de GitHub : pas
        # d'apt dans ce cas. Sinon, 3 essais espacés (miroirs Ubuntu en 503).
        run: |
          if command -v psql >/dev/null; then psql --version; exit 0; fi
          for attempt in 1 2 3; do
            sudo apt-get update -qq \
              && sudo apt-get install -y -qq -o Acquire::Retries=3 postgresql-client \
              && break
            [ "$attempt" = 3 ] && exit 1
            echo "Échec de l'installation, nouvel essai dans 20 s"; sleep 20
          done
          psql --version
      - name: Tests base de données (acceptation, concurrence, volume)
        run: bash scripts/db-test.sh

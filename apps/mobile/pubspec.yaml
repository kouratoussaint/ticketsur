name: ticketsur
description: "TicketSûr — Votre événement en un clic. Billetterie et contrôle d'accès par QR code."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: 3.50.0

dependencies:
  archive: ^4.7.1
  audioplayers: ^6.8.1
  barcode_widget: ^2.0.4
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.11.1
  mobile_scanner: ^7.5.0
  pdf: ^3.13.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/sounds/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

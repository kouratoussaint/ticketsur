name: ticketsur
description: "TicketSûr — Votre événement en un clic. Billetterie et contrôle d'accès par QR code."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: 3.50.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
